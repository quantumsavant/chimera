[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-workflow"
version = "0.2.0"
description = "CHIMERA — Production-Grade Fault-Tolerant DAG Workflow Engine in Pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CHIMERA Contributors" }
]
keywords = ["workflow", "dag", "orchestration", "event-sourcing", "fault-tolerance", "multiprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quantumsavant/chimera"
Repository = "https://github.com/quantumsavant/chimera"

[tool.setuptools.packages.find]
where = ["src"]
